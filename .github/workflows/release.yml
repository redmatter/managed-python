name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    # Arm64 self-hosted fleet (cicd-github-actions 1.1). The runner image is
    # almalinux:10 and installs the zip CLI and gh 2.102.0, which is everything this
    # job uses; redmatter/nbinternal-skills creates releases with attached assets
    # from the same fleet. The zip CLI preserves the executable bit on install.sh,
    # which Python's zipfile would not.
    runs-on: codebuild-ghSelfhostedRunnersArm64-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6

      - name: Verify tag matches distro.toml version
        run: |
          # Uses the POSIX [[:space:]] class rather than the GNU-only shorthand,
          # so this check can be reproduced locally on macOS (BSD sed) too.
          # Keeps one dialect across the repo - matches install.sh (see #2).
          TOML_VERSION="$(grep '^version' distro.toml | sed -E 's/^[^=]+=[[:space:]]*"([^"]+)".*/\1/')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$TAG_VERSION" != "$TOML_VERSION" ]]; then
            echo "ERROR: tag ${GITHUB_REF_NAME} does not match distro.toml version ${TOML_VERSION}"
            exit 1
          fi

      - name: Build release archive
        run: |
          VERSION="${GITHUB_REF_NAME}"
          zip "managed-python-${VERSION}.zip" \
            distro.toml install.sh install.ps1 install.bat setup.py

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          gh release create "$VERSION" \
            "managed-python-${VERSION}.zip" \
            --title "$VERSION" \
            --generate-notes
