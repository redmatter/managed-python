name: Test Windows Installer

# On-demand only. Nothing here runs on push or pull_request: every run downloads
# uv (~34 MB) and a managed CPython interpreter (~30 MB) into fresh prefixes, which
# is far too slow and too costly to attach to every PR. Dispatch it against the
# branch or PR head you want to test:
#
#   gh workflow run test-windows-installer.yml --ref <branch> -f arch=x64
#
# The second install is the assertion that matters. Until PR #15 an install.ps1
# bug made the "already installed, skip the download" branch unreachable on
# Windows, so every re-run silently re-downloaded uv. Nothing in CI could catch
# that, which is why this job exists.
#
# Shell coverage, and why there is no matrix here: a `shell:` field cannot be
# driven from a strategy matrix (GitHub rejects the workflow with "Unrecognized
# named-value: 'matrix'"), so the two shells are separate steps. PowerShell 7 runs
# install.ps1 directly. Windows PowerShell 5.1 runs it through install.bat, which
# is the documented fallback for machines where script execution is blocked and is
# itself a `powershell -ExecutionPolicy Bypass` wrapper, so it exercises 5.1 too.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to test. Leave empty to test the branch this workflow is dispatched from.'
        required: false
        type: string
      arch:
        description: 'Windows architecture to test. arm64 needs the windows-11-arm runner to be enabled for this repository.'
        required: false
        type: choice
        default: x64
        options:
          - x64
          - arm64

# Least privilege: this job reads the repository and nothing else.
permissions:
  contents: read

# No actions/cache here on purpose. The 30-second caching rule targets package
# managers, and caching uv or the interpreter would defeat the point: this job
# exists to prove a *fresh* install works and that the second run correctly skips.
jobs:
  install:
    name: Install on Windows ${{ inputs.arch }}
    # The self-hosted fleet is Alma Linux and Ubuntu only, so there is no Windows
    # runner to use, and this job is nothing but Windows-only behaviour: the arch
    # selection in install.ps1, the .zip release asset, and Windows PowerShell 5.1,
    # which is the shell install.bat invokes.
    # RUNNER-EXCEPTION: no Windows runner exists on the self-hosted fleet (cicd-github-actions 1.3)
    runs-on: ${{ inputs.arch == 'arm64' && 'windows-11-arm' || 'windows-latest' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Report the interpreters and architecture under test
        run: |
          Write-Host "pwsh       : $($PSVersionTable.PSVersion)"
          Write-Host "powershell : $(powershell -NoProfile -Command '$PSVersionTable.PSVersion')"
          Write-Host "PROCESSOR  : $env:PROCESSOR_ARCHITECTURE"

      - name: Read the pinned uv version from distro.toml
        run: |
          $line = Select-String -Path distro.toml -Pattern '^uv_version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if ($null -eq $line) { throw "no uv_version line found in distro.toml" }
          $pin = $line.Matches[0].Groups[1].Value
          Write-Host "pinned uv: $pin"
          # Add-Content, not Out-File: Windows PowerShell 5.1 writes a BOM with
          # Out-File -Encoding utf8, and a BOM corrupts the GITHUB_ENV variable name.
          Add-Content -Path $env:GITHUB_ENV -Value "UV_PIN=$pin"

      - name: PowerShell 7 - first install
        run: ./install.ps1 -Prefix "$env:RUNNER_TEMP\mp-pwsh" -Python 3.14 -EnvPrefix MPWINTESTPW -Isolated

      - name: PowerShell 7 - assert the pinned uv and its uvx twin are installed
        run: |
          $uv = "$env:RUNNER_TEMP\mp-pwsh\uv.exe"
          if (-not (Test-Path $uv)) { throw "uv.exe was not installed" }
          if (-not (Test-Path "$env:RUNNER_TEMP\mp-pwsh\uvx.exe")) { throw "uvx.exe was not installed" }
          $actual = (& $uv --version 2>$null) -replace '^uv\s+(\S+).*', '$1'
          if ($actual -ne $env:UV_PIN) { throw "uv reports '$actual' but distro.toml pins '$env:UV_PIN'" }

      - name: PowerShell 7 - second install must skip rather than re-download
        run: |
          # Do not drop 6>&1: install.ps1 reports through Write-Host, which writes to
          # the information stream and is NOT captured by 2>&1 alone. Without it this
          # step cannot see the installer's messages at all.
          #
          # The output text is the only reliable signal here. Comparing uv.exe's
          # timestamp would prove nothing: install.ps1 copies the binary out of the
          # archive with Copy-Item, which preserves the archive's own timestamp, so a
          # genuine re-download leaves the destination's write time unchanged.
          $out = ./install.ps1 -Prefix "$env:RUNNER_TEMP\mp-pwsh" -Python 3.14 -EnvPrefix MPWINTESTPW -Isolated 2>&1 6>&1 | Out-String
          Write-Host $out
          if ($out -match 'Downloading uv') { throw "the second run re-downloaded uv: the skip branch did not fire" }
          if ($out -notmatch [regex]::Escape($env:UV_PIN)) { throw "the second run never reported the pinned uv version" }
          if ($out -notmatch 'venv already exists') { throw "the second run rebuilt the venv" }

      - name: Windows PowerShell 5.1 via install.bat - first install
        shell: cmd
        run: install.bat -Prefix "%RUNNER_TEMP%\mp-bat" -Python 3.14 -EnvPrefix MPWINTESTBAT -Isolated > "%RUNNER_TEMP%\bat-first.txt" 2>&1

      - name: Windows PowerShell 5.1 via install.bat - second install must skip
        shell: cmd
        run: install.bat -Prefix "%RUNNER_TEMP%\mp-bat" -Python 3.14 -EnvPrefix MPWINTESTBAT -Isolated > "%RUNNER_TEMP%\bat-second.txt" 2>&1

      - name: Windows PowerShell 5.1 - assert the uv and the skipped second run
        run: |
          $uv = "$env:RUNNER_TEMP\mp-bat\uv.exe"
          if (-not (Test-Path $uv)) { throw "install.bat did not produce uv.exe" }
          $actual = (& $uv --version 2>$null) -replace '^uv\s+(\S+).*', '$1'
          if ($actual -ne $env:UV_PIN) { throw "install.bat produced uv '$actual' but distro.toml pins '$env:UV_PIN'" }
          Write-Host (Get-Content "$env:RUNNER_TEMP\bat-first.txt" -Raw)
          $out = Get-Content "$env:RUNNER_TEMP\bat-second.txt" -Raw
          Write-Host $out
          if ($out -match 'Downloading uv') { throw "the second install.bat run re-downloaded uv: the skip branch did not fire under Windows PowerShell 5.1" }
          if ($out -notmatch 'venv already exists') { throw "the second install.bat run rebuilt the venv" }
